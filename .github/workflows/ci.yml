name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: ruff check
        run: uvx ruff check .
      - name: ruff format --check
        run: uvx ruff format --check .

  test:
    name: Test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package + dev extras
        run: uv sync --extra dev
      - name: pytest
        run: uv run pytest -v

  build:
    name: Build (sdist + wheel)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: Build
        run: uv build
      - name: Verify wheel installs + imports + entry-point shim
        run: |
          uv venv /tmp/verify --python 3.13
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          test -x /tmp/verify/bin/faf-memory-mcp
          /tmp/verify/bin/python -c "from faf_memory_mcp.server import mcp; assert mcp.name == 'faf-memory'; print('wheel installs, imports OK, name=' + mcp.name)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
