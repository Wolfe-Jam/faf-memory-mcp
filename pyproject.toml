[project]
name = "faf-memory-mcp"
version = "0.1.1"
description = "MCP server for .fafm — the Permanent Memory Layer (PML). Wraps claude-fafm-sdk via fastmcp. IANA-registered, cross-vendor, offline-first."
authors = [{ name = "James Wolfe", email = "team@faf.one" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "faf",
    "fafm",
    "faf-memory",
    "mcp",
    "model-context-protocol",
    "pml",
    "permanent-memory",
    "memory-layer",
    "claude",
    "claude-code",
    "agent-memory",
    "iana",
    "cross-vendor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "claude-fafm-sdk>=0.3.0",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://memory.faf.one"
Repository = "https://github.com/Wolfe-Jam/faf-memory-mcp"
Documentation = "https://faf.one/memory"
"Bug Tracker" = "https://github.com/Wolfe-Jam/faf-memory-mcp/issues"
"Falsifiable Receipt (412×)" = "https://github.com/Wolfe-Jam/faf-memory-proof"
"MEMORY-FORMAT spec" = "https://github.com/Wolfe-Jam/faf/blob/main/MEMORY-FORMAT.md"
"FAFM Paper (Zenodo)" = "https://doi.org/10.5281/zenodo.20348942"

[project.scripts]
faf-memory-mcp = "faf_memory_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faf_memory_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dist", "build", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
exclude = ["dist/", "build/", ".venv/", "tests/"]

